<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>To-Do List App</title>
</head>
<body>
    <div class="container">
        <h1>To-Do List</h1>
        <input type="text" id="taskInput" placeholder="Add a new task...">
        <button id="addTaskBtn">Add Task</button>
        <button id="exportBtn">Export Tasks</button>
        <input type="file" id="importFile" accept="application/json">
        <button id="clearCompletedBtn">Clear Completed</button>
        <div id="filterButtons">
            <button id="filterAll">All</button>
            <button id="filterActive">Active</button>
            <button id="filterCompleted">Completed</button>
            <button id="filterHighPriority">High Priority</button>
        </div>
        <div id="taskStats"></div>
        <ul id="taskList"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
